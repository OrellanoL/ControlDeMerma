<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Interno de Merma - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .card-header {
            background: #0033a0;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }
        .badge {
            background: #e60000;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .card-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .card-header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            opacity: 0.85;
        }
        .card-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0033a0;
            outline: none;
        }
        .helper-text {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            display: block;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #1a56db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #0033a0;
        }
        .card-footer {
            background: #fafbfc;
            border-top: 1px solid #eaeef2;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Cabecera Institucional -->
        <div class="card-header">
            <span class="badge">Carrefour Express</span>
            <h1>Control Interno de Merma</h1>
            <p>Gestión de Vencimientos y Stock por Sucursal</p>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="card-body">
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario de Tienda o DNI</label>
                    <input type="text" id="usuario" placeholder="Ej: tienda_429 o su DNI" required autocomplete="off">
                    <span class="helper-text">Admin: tienda_número | Repositor: DNI</span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña (Opcional para Repositor)</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">INGRESAR AL SISTEMA</button>
                <div id="mensaje"></div>
            </form>
        </div>

        <!-- Pie de tarjeta -->
        <div class="card-footer">
            Zona 1 — Operaciones de Control de Vtos
        </div>
    </div>

    <script>
        // Credenciales de Supabase
        const SUPABASE_URL = 'https://jtpobhgjjwrgtmzxvwsp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7lS6ptxFvZVqXXWdcbHopw_YNXlUTOT'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Corregido: uso de paréntesis en lugar de corchetes
            const inputUsuario = document.getElementById('usuario').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const mensaje = document.getElementById('mensaje');

            mensaje.style.color = '#333';
            mensaje.textContent = 'Verificando credenciales...';

            try {
                // CASO 1: Ingresó como Administrador (Formato tienda_x)
                const matchTienda = inputUsuario.match(/tienda_(\d+)/);
                
                if (matchTienda) {
                    const codigoSucursal = matchTienda[1];

                    const { data, error } = await supabaseClient
                        .from('tiendas')
                        .select('*')
                        .eq('codigo_sucursal', codigoSucursal)
                        .single();

                    if (error || !data) {
                        mensaje.style.color = '#d9534f';
                        mensaje.textContent = `La sucursal ${codigoSucursal} no está registrada.`;
                        return;
                    }

                    if (data.password === password) {
                        localStorage.setItem('sesion_actual', JSON.stringify({
                            tipo: 'tienda_admin',
                            id: data.id,
                            codigo: data.codigo_sucursal,
                            nombre: data.nombre_sucursal,
                            google_refresh_token: data.google_refresh_token || null
                        }));

                        mensaje.style.color = 'green';
                        mensaje.textContent = '¡Acceso de Admin exitoso! Redirigiendo...';
                        
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        mensaje.style.color = '#d9534f';
                        mensaje.textContent = 'Contraseña incorrecta.';
                    }
                    return;
                }

                // CASO 2: Ingresó como Repositor (Buscamos por DNI en usuarios_tienda)
                const { data: usuarioData, error: usuarioError } = await supabaseClient
                    .from('usuarios_tienda')
                    .select(`
                        *,
                        tiendas (
                            id,
                            codigo_sucursal,
                            nombre_sucursal
                        )
                    `)
                    .eq('dni', inputUsuario)
                    .maybeSingle();

                if (usuarioError || !usuarioData) {
                    mensaje.style.color = '#d9534f';
                    mensaje.textContent = 'Usuario o DNI no registrado en el sistema.';
                    return;
                }

                // Guardamos la sesión del repositor asociada a su tienda correspondiente
                // Guardamos la sesión del repositor asociada a su tienda correspondiente
localStorage.setItem('sesion_actual', JSON.stringify({
    tipo: 'repositor',
    id: usuarioData.id, // <-- ¡Agregamos esto para que la app reconozca el ID del repositor!
    dni: usuarioData.dni,
    nombre: `${usuarioData.nombre || ''} ${usuarioData.apellido || ''}`.trim(),
    id_tienda: usuarioData.tiendas ? usuarioData.tiendas.id : usuarioData.tienda_id,
    codigo_tienda: usuarioData.tiendas ? usuarioData.tiendas.codigo_sucursal : null,
    nombre_tienda: usuarioData.tiendas ? usuarioData.tiendas.nombre_sucursal : null
}));

                localStorage.setItem('repositorDni', usuarioData.dni);
                localStorage.setItem('rolUsuario', 'repositor');
                localStorage.setItem('tiendaActual', usuarioData.tiendas ? `tienda_${usuarioData.tiendas.codigo_sucursal}` : usuarioData.tienda_id);

                mensaje.style.color = 'green';
                mensaje.textContent = '¡Acceso de Repositor exitoso! Redirigiendo...';

                setTimeout(() => {
                    window.location.href = 'vencimientos.html';
                }, 1000);

            } catch (err) {
                console.error(err);
                mensaje.style.color = '#d9534f';
                mensaje.textContent = 'Error de conexión con la base de datos.';
            }
        });
    </script>
</body>
</html>
