<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Interno de Merma - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #002D62 0%, #001B3A 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-header {
            background: #0033a0;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }
        .logo-img {
            height: 72px;
            margin-bottom: 12px;
            object-fit: contain;
            filter: brightness(0) invert(1); /* Vuelve el logo blanco puro para que combine perfectamente con el fondo azul */
        }
        .card-header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card-header p {
            margin: 6px 0 0 0;
            font-size: 13px;
            color: #cbd5e1;
        }
        .card-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #0033a0;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 51, 160, 0.1);
        }
        .helper-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
            display: block;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #0033a0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 12px rgba(0, 51, 160, 0.3);
        }
        .btn-submit:hover {
            background-color: #00226e;
            transform: translateY(-1px);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .card-footer {
            background: #f8fafc;
            border-top: 1px solid #f1f5f9;
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Cabecera Institucional limpia sin recuadro -->
        <div class="card-header">
            <img src="https://raw.githubusercontent.com/OrellanoL/ProductosCatalogo/main/carrefourexpresslogo.webp" alt="Carrefour Express" class="logo-img">
            <h1>Control Interno de Merma</h1>
            <p>Gestión de Vencimientos y Stock por Sucursal</p>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="card-body">
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario de Tienda o DNI</label>
                    <input type="text" id="usuario" placeholder="Ej: tienda_429 o su DNI" required autocomplete="off">
                    <span class="helper-text">Admin: tienda_número | Repositor: DNI</span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña (Opcional para Repositor)</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-submit">INGRESAR AL SISTEMA</button>
                <div id="mensaje"></div>
            </form>
        </div>

        <!-- Pie de tarjeta -->
        <div class="card-footer">
            Zona 1 — Operaciones de Control de Vtos
        </div>
    </div>

    <script>
        // Credenciales de Supabase
        const SUPABASE_URL = 'https://jtpobhgjjwrgtmzxvwsp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7lS6ptxFvZVqXXWdcbHopw_YNXlUTOT'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputUsuario = document.getElementById('usuario').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const mensaje = document.getElementById('mensaje');

            mensaje.style.color = '#333';
            mensaje.textContent = 'Verificando credenciales...';

            try {
                // CASO 1: Ingresó como Administrador (Formato tienda_x)
                const matchTienda = inputUsuario.match(/tienda_(\d+)/);
                
                if (matchTienda) {
                    const codigoSucursal = matchTienda[1];

                    const { data, error } = await supabaseClient
                        .from('tiendas')
                        .select('*')
                        .eq('codigo_sucursal', codigoSucursal)
                        .single();

                    if (error || !data) {
                        mensaje.style.color = '#d9534f';
                        mensaje.textContent = `La sucursal ${codigoSucursal} no está registrada.`;
                        return;
                    }

                    if (data.password === password) {
                        localStorage.setItem('sesion_actual', JSON.stringify({
                            tipo: 'tienda_admin',
                            id: data.id,
                            codigo: data.codigo_sucursal,
                            nombre: data.nombre_sucursal,
                            google_refresh_token: data.google_refresh_token || null
                        }));

                        mensaje.style.color = 'green';
                        mensaje.textContent = '¡Acceso de Admin exitoso! Redirigiendo...';
                        
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        mensaje.style.color = '#d9534f';
                        mensaje.textContent = 'Contraseña incorrecta.';
                    }
                    return;
                }

                // CASO 2: Ingresó como Repositor (Buscamos por DNI en usuarios_tienda)
                const { data: usuarioData, error: usuarioError } = await supabaseClient
                    .from('usuarios_tienda')
                    .select(`
                        *,
                        tiendas (
                            id,
                            codigo_sucursal,
                            nombre_sucursal
                        )
                    `)
                    .eq('dni', inputUsuario)
                    .maybeSingle();

                if (usuarioError || !usuarioData) {
                    mensaje.style.color = '#d9534f';
                    mensaje.textContent = 'Usuario o DNI no registrado en el sistema.';
                    return;
                }

                // Guardamos la sesión del repositor asociada a su tienda correspondiente
                localStorage.setItem('sesion_actual', JSON.stringify({
                    tipo: 'repositor',
                    id: usuarioData.id,
                    dni: usuarioData.dni,
                    nombre: `${usuarioData.nombre || ''} ${usuarioData.apellido || ''}`.trim(),
                    id_tienda: usuarioData.tiendas ? usuarioData.tiendas.id : usuarioData.tienda_id,
                    codigo_tienda: usuarioData.tiendas ? usuarioData.tiendas.codigo_sucursal : null,
                    nombre_tienda: usuarioData.tiendas ? usuarioData.tiendas.nombre_sucursal : null
                }));

                localStorage.setItem('repositorDni', usuarioData.dni);
                localStorage.setItem('rolUsuario', 'repositor');
                localStorage.setItem('tiendaActual', usuarioData.tiendas ? `tienda_${usuarioData.tiendas.codigo_sucursal}` : usuarioData.tienda_id);

                mensaje.style.color = 'green';
                mensaje.textContent = '¡Acceso de Repositor exitoso! Redirigiendo...';

                setTimeout(() => {
                    window.location.href = 'vencimientos.html';
                }, 1000);

            } catch (err) {
                console.error(err);
                mensaje.style.color = '#d9534f';
                mensaje.textContent = 'Error de conexión con la base de datos.';
            }
        });
    </script>
</body>
</html>
